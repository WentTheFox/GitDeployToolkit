# Server inventory (copy to servers.local.yml, which is gitignored)
#
# Nothing in this toolkit's scripts reads this file — it's just a place to
# jot down which real host is which, since that's not derivable from the
# code itself. Keep your actual hostnames/paths here instead of in any
# tracked file. Hosts are resolved by name only (/etc/hosts), so no IPs
# needed here.
#
# `sensitive: true` on an app entry means its NAME (not just paths/hosts,
# which already never go in tracked files) must never appear in any
# tracked/committed file anywhere — this toolkit's own CLAUDE.md/README,
# commit messages, PR descriptions, code comments, everything. Refer to
# it obliquely instead ("a sensitive app on the second VPS") in anything
# that ends up in source control. servers.local.yml itself is gitignored,
# so the real name is still fine to write right here.

server-a.example:
  os: Debian 12
  runtime: nginx + php-fpm + pm2
  toolkit_status: not migrated   # or: migrated, or omit if unset
  apps:
    - name: myapp
      manager: pm2
    - name: another-app
      manager: systemd
      sensitive: true   # never name this app in any tracked file
  notes: []

pi.example:
  os: Raspbian
  runtime: docker compose
  toolkit_status: not attempted
  apps:
    - name: homelab
      manager: docker-compose
      repo: github.com/example/homelab
  notes:
    - not a deploy target currently
