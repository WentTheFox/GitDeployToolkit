# Server inventory (copy to servers.local.yml, which is gitignored)
#
# Nothing in this toolkit's scripts reads this file — it's just a place to
# jot down which real host is which, since that's not derivable from the
# code itself. Keep your actual hostnames/paths here instead of in any
# tracked file. Hosts are resolved by name only (/etc/hosts), so no IPs
# needed here.
#
# `sensitive: true` on an app entry means BOTH its name AND which server
# it's on are sensitive — neither may appear in any tracked/committed
# file anywhere: this toolkit's own CLAUDE.md/README, commit messages,
# PR descriptions, code comments, everything. Don't launder this into an
# oblique-but-still-identifying reference either (e.g. naming the host
# without the app still narrows it down) — say nothing identifying at
# all, or don't mention it. servers.local.yml itself is gitignored, so
# the real name and host are still fine to write right here.

server-a.example:
  os: Debian 12
  runtime: nginx + php-fpm + pm2
  toolkit_status: not migrated   # or: migrated, or omit if unset
  apps:
    - name: myapp
      manager: pm2
    - name: another-app
      manager: systemd
      sensitive: true   # never name this app in any tracked file
  notes: []

pi.example:
  os: Raspbian
  runtime: docker compose
  toolkit_status: not attempted
  apps:
    - name: homelab
      manager: docker-compose
      repo: github.com/example/homelab
  notes:
    - not a deploy target currently
