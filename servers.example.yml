# Server inventory (copy to servers.local.yml, which is gitignored)
#
# Nothing in this toolkit's scripts reads this file — it's just a place to
# jot down which real host is which, since that's not derivable from the
# code itself. Real hostnames/IPs/paths are ALWAYS sensitive — keep them
# here instead of in any tracked file, unconditionally, regardless of
# whether any app below is flagged sensitive. Hosts are resolved by name
# only (/etc/hosts), so no IPs needed here.
#
# `sensitive: true` on an app entry is about that app specifically, on
# top of the always-sensitive host names above: its NAME must never
# appear in any tracked/committed file anywhere — this toolkit's own
# CLAUDE.md/README, commit messages, PR descriptions, code comments,
# everything. Don't launder this into an oblique-but-still-identifying
# reference either — naming the host it's on (itself already forbidden)
# or any other detail that narrows it to one of a handful of candidates
# still identifies it. Say nothing identifying at all, or don't mention
# it. servers.local.yml itself is gitignored, so the real name is still
# fine to write right here.
#
# Freeform note text almost always ends up containing a ": " somewhere
# (a URL, a ratio, a label) — as a bare `- some text: like this` list
# item, that colon-space is parsed as a mapping key, not prose, and
# breaks the file (YAML doesn't validate multi-line plain scalars the
# way you'd expect — see this repo's actual git history for a real
# instance of exactly this breaking servers.local.yml). Write any note
# over one line, or containing a colon at all, as a block scalar
# instead: `- >-` on its own line, then the text indented underneath.
# Validate after editing: `python3 -c "import yaml;
# yaml.safe_load(open('servers.local.yml'))"`.

server-a.example:
  os: Debian 12
  runtime: nginx + php-fpm + pm2
  toolkit_status: not migrated   # or: migrated, or omit if unset
  apps:
    - name: myapp
      manager: pm2
      live_url: https://myapp.example   # optional, for a quick health-check curl target
    - name: another-app
      manager: systemd
      sensitive: true   # never name this app in any tracked file
  notes: []

pi.example:
  os: Raspbian
  runtime: docker compose
  toolkit_status: not attempted
  apps:
    - name: homelab
      manager: docker-compose
      repo: github.com/example/homelab
  notes:
    - not a deploy target currently
